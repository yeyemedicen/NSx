
mesh: './tests/rectangle_shared.xdmf'

# Physical parameters of the fluid  
fluid:
    density: 1.06
    dynamic_viscosity: 0.035
    stokes: False

io:
    write_path: './tests/results/'
    restart:
        path: '' 
        time: 0
    write_xdmf: True
    write_checkpoints: True
    write_hdf5_timeseries: False
    write_velocity: 'tentative'     # update or tentative

boundary_conditions:
    - 
        id: 2
        type: 'dirichlet'
        value: ['U','0']
        parameters:
            U: 0.1
    - 
        id: 1
        type: 'dirichlet'
        value: ['0','0']
    - 
        id: 4
        type: 'dirichlet'
        value: ['0','0']
    - 
        id: 3
        type: 'neumann'
        value: 0


timemarching:
    velocity_pressure_coupling: 'fractionalstep'    # monolithic, fractionalstep
    monolithic:
    fractionalstep:
        scheme: 'CT'      # CT, IPCS
        coupled_velocity: True     # False faster, True needed if robin_bc implicit
        robin_bc_velocity_scheme: 'implicit' # explicit, semi-implicit, implicit
        transpiration_bc_projection: 'robin'      # robin, dirichlet
        flux_report_normalize_boundary: 1

    T: 0.5      # end time
    dt: 0.001
    write_dt: 0.01
    checkpoint_dt:  0.01 # <= 0: only last; else value + last
    report: 1   # 0: print nothing, 1: print time step and writeout, 2: 1 + flux

windkessel:
    implicit: False

fem:
    velocity_space: p2  # p1 p1b/p1+ p2
    pressure_space: p1  # p1 p0/dg0 dg1
    DC_in_update: True
    PEN_in_update: False
    strain_symmetric: False
    convection_skew_symmetric: True    # aka Temam term
    stabilization:
        forced_normal:
            enabled: False
            type: 'explicit'
            boundaries: []
            gamma: 1e+8
        backflow_boundaries: []
        streamline_diffusion:
            enabled: False
            parameter: 'standard'   # standard, shakib, codina, klr
            length_scale: 'metric' # average, max, metric
            parameter_element_constant: True
            Cinv: ~
        monolithic:

    fix_pressure: False
    fix_pressure_point: [0. , 0.]

linear_solver:
    method: 'lu'
    #inputfile: './scripts/pc/fgmres_ml_rtol1e-6.yaml'

estimation:
    boundary_conditions:
    
    roukf:
        particles: 'simplex' # unique or simplex
        observation_operator: 'postprocessing'         #state or postprocessing
        reparameterize: True
        MAG_functional: False
